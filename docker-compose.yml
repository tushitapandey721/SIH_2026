version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ip-sakti-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - BHASHINI_ENDPOINT=${BHASHINI_ENDPOINT:-}
      - BHASHINI_USER_ID=${BHASHINI_USER_ID:-}
      - BHASHINI_API_KEY=${BHASHINI_API_KEY:-}
      - BHASHINI_PIPELINE_ID=${BHASHINI_PIPELINE_ID:-}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,*
    volumes:
      - qdrant_storage:/app/qdrant_data
      - db_storage:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: ip-sakti-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qdrant_storage:
  db_storage:
